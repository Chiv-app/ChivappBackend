[project]
name = "chivapp-backend"
version = "1.0.0"
description = "Chivapp Backend API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: requiere una base Postgres real (ver tests/conftest.py)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
