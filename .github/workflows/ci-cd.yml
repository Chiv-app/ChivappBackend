name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run Tests & Security Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mariachi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mariachi_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check --select F821,F822,F823 app tests

      - name: Audit dependencies with pip-audit
        run: |
          pip-audit -r requirements.txt --no-deps --disable-pip --ignore-vuln PYSEC-2026-4298

      - name: Validate production Settings(_env_file=None) and rate limiter
        env:
          ENVIRONMENT: production
          ENABLE_HSTS: "True"
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://prod_user:StrongProdPass123!@10.0.0.5:5432/chivapp_prod
          JWT_SECRET_KEY: prod-jwt-secret-key-with-more-than-32-chars-ok
          PROXY_SHARED_SECRET: prod-proxy-shared-secret-with-32-plus-chars-ok
          GCP_BUCKET_NAME: chivapp-uploads
          GCP_PRIVATE_BUCKET_NAME: chivapp-private-uploads
          RATE_LIMIT_STORAGE_URI: redis://10.0.0.6:6379/0
          FRONTEND_URL: https://chiv.app
          BACKEND_CORS_ORIGINS: '["https://chiv.app","https://www.chiv.app","https://api.chiv.app"]'
          MERCADO_PAGO_SANDBOX: "False"
        run: |
          python -c "from app.core.config import Settings; s = Settings(_env_file=None); from slowapi import Limiter; from slowapi.util import get_remote_address; Limiter(key_func=get_remote_address, storage_uri=s.RATE_LIMIT_STORAGE_URI)"

      - name: Verify Alembic migrations (upgrade head + check)
        env:
          ENVIRONMENT: development
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:postgres@localhost:5432/mariachi_test
          JWT_SECRET_KEY: ci-test-secret-key-for-github-actions-minimum-32-bytes
        run: |
          python -m app.db.alembic_bootstrap
          alembic upgrade head
          alembic check

      - name: Run Pytest (unit + integration)
        env:
          ENVIRONMENT: development
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:postgres@localhost:5432/mariachi_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mariachi_test
          JWT_SECRET_KEY: ci-test-secret-key-for-github-actions-minimum-32-bytes
          EMAIL_ENABLED: "false"
        run: |
          pytest -q

  deploy:
    name: Deploy to Cloud Run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create Artifact Registry (if missing)
        run: |
          gcloud artifacts repositories create cloud-run-source-deploy \
            --repository-format=docker \
            --location=us-central1 \
            --description="Docker repository for Cloud Run deployments" || true

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/backend:latest .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/backend:latest

      - name: Ensure Private Uploads Bucket Exists
        run: |
          if ! gcloud storage buckets describe gs://chivapp-private-uploads --project="${{ secrets.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud storage buckets create gs://chivapp-private-uploads \
              --location=us-central1 \
              --uniform-bucket-level-access \
              --project="${{ secrets.GCP_PROJECT_ID }}" || true
          fi
          gcloud storage buckets update gs://chivapp-private-uploads --pap --project="${{ secrets.GCP_PROJECT_ID }}" || true

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: chivappbackend
          region: us-central1
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/backend:latest
          env_vars: |
            ENVIRONMENT=production
            ENABLE_HSTS=True
            LOG_LEVEL=info
            FRONTEND_URL=https://chiv.app
            OAUTH_REDIRECT_BASE_URL=https://chiv.app/api/v1
            GOOGLE_OAUTH_REDIRECT_URI=https://chiv.app/calendar-callback
            GCP_BUCKET_NAME=chivapp-uploads
            GCP_PRIVATE_BUCKET_NAME=chivapp-private-uploads
